name: Android CI → Build APK + Upload + Email

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Build release APK
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PstoreFile=release.jks \
            -PstorePassword=${{ secrets.STORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      # 5️⃣ Rename APK with commit hash & timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          NEW_APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/${NEW_APK_NAME}
          echo "APK_PATH=app/build/outputs/apk/release/${NEW_APK_NAME}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_APK_NAME}" >> $GITHUB_ENV

      # 6️⃣ Upload APK to file.io
      - name: Upload APK to file.io
        id: upload
        run: |
          FILE_PATH=$(find . -name "*release.apk" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi

          RESPONSE=$(curl -s -F "file=@$FILE_PATH" https://file.io)
          DOWNLOAD_LINK=$(echo "$RESPONSE" | jq -r '.link')

          if [ -z "$DOWNLOAD_LINK" ] || [ "$DOWNLOAD_LINK" == "null" ]; then
            echo "❌ Failed to upload to file.io"
            echo "$RESPONSE"
            exit 1
          fi

          echo "share_link=$DOWNLOAD_LINK" >> $GITHUB_OUTPUT
          echo "DIRECT_LINK=$DOWNLOAD_LINK" >> $GITHUB_ENV

      # 8️⃣ Set timestamp for email
      - name: Set timestamp
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # 9️⃣ Send email to testers
      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          subject: "A new release APK has been uploaded"
          body: |
            Hi team,

            The latest release APK has been uploaded.

            Direct Download Link: ${{ env.DIRECT_LINK }}

            Commit: ${{ github.sha }}
            Timestamp: ${{ env.time }}
          secure: true
