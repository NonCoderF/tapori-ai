name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. Rename APK with commit hash and timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          APK_PATH=app/build/outputs/apk/release/app-release.apk
          NEW_APK_NAME=app/build/outputs/apk/release/app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          mv $APK_PATH $NEW_APK_NAME
          echo "APK_PATH=$NEW_APK_NAME" >> $GITHUB_ENV

      # 6. Upload APK as artifact
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}

      # 7. Send APK via Email
      - name: Send APK via Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: "New Release APK - Commit ${{ github.sha }}"
          body: "Hi team, please find the latest release APK attached. Commit: ${{ github.sha }} Timestamp: $(date +%Y-%m-%d\ %H:%M:%S)"
          to: tester1@example.com,tester2@example.com
          attachments: ${{ env.APK_PATH }}
          secure: true
