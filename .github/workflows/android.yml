name: Android CI → Build APK + Upload to Dropbox + Email

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Build release APK
      - name: Build release APK
        run: ./gradlew assembleRelease

      # 5️⃣ Rename APK with commit hash & timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          NEW_APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          LATEST_APK=$(ls -t app/build/outputs/apk/release/*.apk | head -n 1)
          mv $LATEST_APK app/build/outputs/apk/release/${NEW_APK_NAME}
          echo "APK_PATH=app/build/outputs/apk/release/${NEW_APK_NAME}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_APK_NAME}" >> $GITHUB_ENV

      # 6️⃣ Upload APK to Dropbox
      - name: Upload to Dropbox
        uses: deka0106/upload-to-dropbox@v2
        with:
          dropbox_access_token: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          src: ${{ env.APK_PATH }}
          dest: /tapori-ai-builds/${{ github.run_number }}-${{ env.APK_NAME }}
          autorename: true

      # 7️⃣ Generate public Dropbox link
      - name: Generate public Dropbox link
        id: dropbox_link
        run: |
          APK_REMOTE_PATH="/tapori-ai-builds/${GITHUB_RUN_NUMBER}-${APK_NAME}"
          RESPONSE=$(curl -s -X POST https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings \
            --header "Authorization: Bearer ${{ secrets.DROPBOX_ACCESS_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"path\": \"${APK_REMOTE_PATH}\", \"settings\": {\"requested_visibility\": \"public\"}}")
          URL=$(echo $RESPONSE | jq -r '.url' | sed 's?dl=0?dl=1?')
          echo "DIRECT_LINK=$URL" >> $GITHUB_ENV
          echo "Dropbox link generated: $URL"

      # 8️⃣ Send email to testers
      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          subject: "New Release APK - Commit ${{ github.sha }}"
          body: |
            Hi team,

            The latest release APK has been uploaded.

            Direct Download Link: ${{ env.DIRECT_LINK }}

            Commit: ${{ github.sha }}
            Timestamp: $(date +%Y-%m-%d %H:%M:%S)
          secure: true
