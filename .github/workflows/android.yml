name: Android CI → Build APK + Upload + Email

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Build release APK
      - name: Build release APK
        run: ./gradlew assembleRelease

      # 5️⃣ Rename APK with commit hash & timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          NEW_APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/${NEW_APK_NAME}
          echo "APK_PATH=app/build/outputs/apk/release/${NEW_APK_NAME}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_APK_NAME}" >> $GITHUB_ENV

      # 6️⃣ Upload APK to transfer.sh
      - name: Upload APK to transfer.sh
        run: |
          FILE_PATH=${{ env.APK_PATH }}
          FILE_NAME=${{ env.APK_NAME }}
          echo "Uploading $FILE_NAME to transfer.sh..."
          URL=$(curl --upload-file "$FILE_PATH" "https://transfer.sh/$FILE_NAME")
          echo "DIRECT_LINK=$URL" >> $GITHUB_ENV
          echo "APK uploaded: $URL"

      # 7️⃣ Send email to testers
      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          subject: "New Release APK - Commit ${{ github.sha }}"
          body: |
            Hi team,

            The latest release APK has been uploaded.

            Direct Download Link: ${{ env.DIRECT_LINK }}

            Commit: ${{ github.sha }}
            Timestamp: $(date +%Y-%m-%d %H:%M:%S)
          secure: true
