name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. Rename APK with commit hash + timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          APK_PATH=app/build/outputs/apk/release/app-release.apk
          NEW_APK_NAME=app/build/outputs/apk/release/app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          mv $APK_PATH $NEW_APK_NAME
          echo "APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}.apk" >> $GITHUB_ENV

      # 6. Upload APK as artifact
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_NAME }}

      # 7. Send email to testers with artifact page link
      - name: Send Email to Testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: "New Release APK - Commit ${{ github.sha }}"
          body: |
            Hi team,

            The latest release APK is available for download as a GitHub artifact:
            https://github.com/${{ github.repository }}/suites/${{ github.run_id }}/artifacts

            Commit: ${{ github.sha }}
            Timestamp: $(date +%Y-%m-%d %H:%M:%S)
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          secure: true
