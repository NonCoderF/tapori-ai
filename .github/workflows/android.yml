name: Build and Send Debug APK via Email

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        id: rename
        run: |
          mkdir -p build_output
          APP_NAME="TaporiAI"
          VERSION_NAME=$(grep versionName app/build.gradle.kts | awk '{print $3}' | tr -d '"')
          FILE_NAME="${APP_NAME}_v${VERSION_NAME}_debug.apk"
          APK_PATH=$(find . -name "*-debug.apk" | head -n 1)
          cp "$APK_PATH" "build_output/$FILE_NAME"
          echo "APK_PATH=build_output/$FILE_NAME" >> $GITHUB_ENV
          echo "APK_NAME=$FILE_NAME" >> $GITHUB_ENV

      - name: Send Email with APK Attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          subject: "🚀 New Debug Build: TaporiAI"
          body: |
            Hi team,

            A new debug build of *Tapori AI* is ready.  
            See the attached APK file.

            🧱 Version: ${{ env.APK_NAME }}
            📦 Commit: ${{ github.sha }}
            🕒 Timestamp: $(date +'%Y-%m-%d %H:%M:%S')

            Regards,  
            GitHub CI Bot 🤖
          secure: true
          attachments: ${{ env.APK_PATH }}
