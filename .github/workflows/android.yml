name: Android CI → Build APK + Upload + Email

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Build release APK
      - name: Build release APK
        run: ./gradlew assembleRelease

      # 5️⃣ Rename APK with commit hash & timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          NEW_APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/${NEW_APK_NAME}
          echo "APK_PATH=app/build/outputs/apk/release/${NEW_APK_NAME}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_APK_NAME}" >> $GITHUB_ENV

      # 6️⃣ Install dependencies for upload
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      # 7️⃣ Upload APK to AnonFiles
      - name: Upload APK to AnonFiles
        id: upload
        run: |
          FILE_PATH=$APK_PATH
          FILE_NAME=$APK_NAME
          echo "Uploading $FILE_NAME to anonfiles.com..."
          RESPONSE=$(curl -s -F "file=@$FILE_PATH" https://api.anonfiles.com/upload)
          URL=$(echo $RESPONSE | jq -r '.data.file.url.full')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: Upload failed, URL is empty"
            exit 1
          fi
          echo "DIRECT_LINK=$URL" >> $GITHUB_ENV
          echo "APK uploaded: $URL"

      # 8️⃣ Set timestamp for email
      - name: Set timestamp
        id: timestamp
        run: echo "::set-output name=time::$(date +'%Y-%m-%d %H:%M:%S')"

      # 9️⃣ Send email to testers
      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          subject: "New Release APK - Commit ${{ github.sha }}"
          body: |
            Hi team,

            The latest release APK has been uploaded.

            Direct Download Link: ${{ env.DIRECT_LINK }}

            Commit: ${{ github.sha }}
            Timestamp: ${{ steps.timestamp.outputs.time }}
          secure: true
