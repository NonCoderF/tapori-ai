name: Android CI → Build APK + Firebase App Distribution + Email

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3️⃣ Grant gradlew permission
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Decode keystore file
      # Save your keystore as BASE64 in GitHub secret:
      # KEYSTORE_BASE64
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > new-upload-key.jks

      # 5️⃣ Build signed release APK
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PstoreFile=new-upload-key.jks \
            -PstorePassword="${{ secrets.STORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.KEY_PASSWORD }}"


      # 6️⃣ Locate APK dynamically
      - name: Find generated APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "Found APK: $APK_FILE"

      # 7️⃣ Rename APK
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          NEW_APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          NEW_APK_PATH=app/build/outputs/apk/release/${NEW_APK_NAME}

          mv "${{ env.APK_FILE }}" "$NEW_APK_PATH"

          echo "APK_PATH=$NEW_APK_PATH" >> $GITHUB_ENV
          echo "APK_NAME=$NEW_APK_NAME" >> $GITHUB_ENV

      # 8️⃣ Build timestamp
      - name: Set build timestamp
        run: |
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # 9️⃣ Upload APK to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: ${{ env.APK_PATH }}
          testers: ${{ secrets.TESTER_EMAILS }}
          releaseNotes: |
            Commit: ${{ github.sha }}
            Built on: ${{ env.BUILD_TIME }}

      # 🔟 Confirmation log
      - name: Print confirmation
        run: echo "✅ APK successfully uploaded to Firebase App Distribution!"

      # 1️⃣1️⃣ Set email timestamp
      - name: Set email timestamp
        run: |
          echo "EMAIL_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # 1️⃣2️⃣ Send email notification
      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          from: ${{ secrets.EMAIL_USERNAME }}

          to: |
            blackiethebigboss1@gmail.com,
            sallyinfo365@gmail.com

          subject: New Android APK Uploaded

          body: |
            Hi Team,

            A new APK has been uploaded to Firebase App Distribution.

            Commit:
            ${{ github.sha }}

            Build Time:
            ${{ env.EMAIL_TIME }}

            APK:
            ${{ env.APK_NAME }}

            Please check Firebase App Distribution email to download the latest build.