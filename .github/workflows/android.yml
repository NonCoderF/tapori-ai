name: Android CI → Build APK + Upload to Dropbox + Email

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Build release APK
      - name: Build release APK
        run: ./gradlew assembleRelease

      # 5️⃣ Rename APK with commit hash & timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          RUN_NUM=${{ github.run_number }}
          NEW_APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}-${RUN_NUM}.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/${NEW_APK_NAME}
          echo "APK_PATH=app/build/outputs/apk/release/${NEW_APK_NAME}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_APK_NAME}" >> $GITHUB_ENV

      # 6️⃣ Upload APK to Dropbox
      - name: Upload to Dropbox
        id: dropbox_upload
        uses: deka0106/upload-to-dropbox@v2
        with:
          dropbox_access_token: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          src: ${{ env.APK_PATH }}
          dest: /tapori-ai-builds/${{ env.APK_NAME }}
          mode: overwrite
          autorename: true
          multiple: false
          mute: false

      # 7️⃣ Generate Dropbox shared link
      - name: Generate Dropbox shared link
        id: dropbox_link
        run: |
          TOKEN=${{ secrets.DROPBOX_ACCESS_TOKEN }}
          FILE_PATH="tapori-ai-builds/${APK_NAME}"
          LINK=$(curl -s -X POST https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"path\": \"/$FILE_PATH\", \"settings\": {\"requested_visibility\": \"public\"}}" | jq -r '.url')
          LINK=${LINK//dl=0/dl=1} # force direct download link
          echo "DROPBOX_LINK=$LINK" >> $GITHUB_ENV

      # 8️⃣ Send email to testers
      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          subject: "New Release APK - Commit ${{ github.sha }}"
          body: |
            Hi team,

            The latest release APK has been uploaded.

            Direct Download Link: ${{ env.DROPBOX_LINK }}

            Commit: ${{ github.sha }}
            Timestamp: $(date +%Y-%m-%d %H:%M:%S)
          secure: true

