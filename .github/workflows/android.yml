name: Android CI → Upload to Google Drive + Email

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK with commit hash & timestamp
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          echo "APK_PATH=app/build/outputs/apk/release/app-release-${COMMIT_HASH}-${TIMESTAMP}.apk" >> $GITHUB_ENV

      - name: Upload APK to Google Drive
        uses: Jodebu/upload-to-drive@v1
        with:
          credentials: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          folder: 1UrFU8YDFr7Px9D6YZtEtMgZfh3Itgw7z
          target: ${{ env.APK_PATH }}
          name: ${{ env.APK_PATH }}

      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          subject: "New Release APK - Commit ${{ github.sha }}"
          body: |
            Hi team,

            The latest release APK has been uploaded to Google Drive.

            Drive Link: https://drive.google.com/drive/folders/1UrFU8YDFr7Px9D6YZtEtMgZfh3Itgw7z

            Commit: ${{ github.sha }}
            Timestamp: $(date +%Y-%m-%d %H:%M:%S)

          secure: true
