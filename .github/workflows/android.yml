name: Android CI → Build Signed APK + Upload + Email

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Decode your keystore file from Base64
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      # Build a signed release APK
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PstoreFile=release.jks \
            -PstorePassword=${{ secrets.STORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      # Rename APK with commit hash & timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          NEW_APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/${NEW_APK_NAME}
          echo "APK_PATH=app/build/outputs/apk/release/${NEW_APK_NAME}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_APK_NAME}" >> $GITHUB_ENV

      # (Optional) Print the signing key SHA1 for verification
      - name: Print signing key SHA1
        run: keytool -list -printcert -jarfile app/build/outputs/apk/release/app-release-*.apk | grep "SHA1"

      - name: Upload APK to Catbox
        id: upload
        run: |
          FILE_PATH=$APK_PATH
          FILE_NAME=$APK_NAME
          echo "Uploading $FILE_NAME to Catbox..."
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            RESPONSE=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@$FILE_PATH" https://catbox.moe/user/api.php)
            if [[ -n "$RESPONSE" ]]; then
              echo "Upload succeeded: $RESPONSE"
              echo "DIRECT_LINK=$RESPONSE" >> $GITHUB_ENV
              break
            fi
            echo "Upload attempt $i failed, retrying..."
            sleep $((i*5))
          done
          if [[ -z "$RESPONSE" ]]; then
            echo "ERROR: Upload failed after $MAX_RETRIES attempts"
            exit 1
          fi
        shell: /usr/bin/bash -e {0}
        env:
          APK_PATH: ${{ env.APK_PATH }}
          APK_NAME: ${{ env.APK_NAME }}

      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com,imchirantan@gmail.com
          subject: "A new release APK has been uploaded"
          body: |
            Hi team,

            The latest **signed release** APK has been uploaded.

            Direct Download Link: ${{ env.DIRECT_LINK }}

            Commit: ${{ github.sha }}
            Timestamp: ${{ github.event.head_commit.timestamp }}
          secure: true
