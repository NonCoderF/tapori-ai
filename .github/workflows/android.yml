name: Android CI → Build Debug APK + Upload + Email Notice

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5️⃣ Rename Debug APK with commit hash & timestamp
      - name: Rename Debug APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          NEW_APK_NAME=app-debug-${COMMIT_HASH}-${TIMESTAMP}.apk
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${NEW_APK_NAME}
          echo "APK_PATH=app/build/outputs/apk/debug/${NEW_APK_NAME}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_APK_NAME}" >> $GITHUB_ENV

      # 6️⃣ Upload APK as GitHub artifact (no public link)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APK-${{ github.run_number }}
          path: ${{ env.APK_PATH }}

      # 7️⃣ Send email (no direct link)
      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com,imchirantan@gmail.com
          subject: "New Debug Build Uploaded 🚀"
          body: |
            Hi team,

            A new **Debug build** is ready for testing.

            🔹 Please visit the GitHub Actions page to download the latest APK:
            👉 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Commit: ${{ github.sha }}
            Timestamp: $(date +'%Y-%m-%d %H:%M:%S')

          secure: true
