name: Android CI → Build APK + Firebase App Distribution + Email

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  ENVIRONMENT: "staging" # change per workflow trigger if needed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Grant execute permission
      - name: Grant execute permission
        run: chmod +x gradlew

      # 4️⃣ Build signed release APK
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PstoreFile=new-upload-key.jks \
            -PstorePassword=${{ secrets.STORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      # 5️⃣ Rename APK with commit hash & timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          NEW_APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/${NEW_APK_NAME}
          echo "APK_PATH=app/build/outputs/apk/release/${NEW_APK_NAME}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_APK_NAME}" >> $GITHUB_ENV

      # 6️⃣ Set build timestamp
      - name: Set build timestamp
        run: echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # 7️⃣ Set environment variables per environment
      - name: Set environment variables
        run: |
          echo "Selected environment: $ENVIRONMENT"
          if [ "$ENVIRONMENT" == "development" ]; then
            echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID_DEV }}" >> $GITHUB_ENV
            echo "TESTERS=${{ secrets.TESTER_EMAILS_DEV }}" >> $GITHUB_ENV
            echo "VARIANT=devRelease" >> $GITHUB_ENV
            echo "DOWNLOAD_LINK=${{ secrets.FIREBASE_DOWNLOAD_LINK_DEV }}" >> $GITHUB_ENV
          elif [ "$ENVIRONMENT" == "staging" ]; then
            echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID_STAGING }}" >> $GITHUB_ENV
            echo "TESTERS=${{ secrets.TESTER_EMAILS_STAGING }}" >> $GITHUB_ENV
            echo "VARIANT=stagingRelease" >> $GITHUB_ENV
            echo "DOWNLOAD_LINK=${{ secrets.FIREBASE_DOWNLOAD_LINK_STAGING }}" >> $GITHUB_ENV
          elif [ "$ENVIRONMENT" == "uat" ]; then
            echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID_UAT }}" >> $GITHUB_ENV
            echo "TESTERS=${{ secrets.TESTER_EMAILS_UAT }}" >> $GITHUB_ENV
            echo "VARIANT=uatRelease" >> $GITHUB_ENV
            echo "DOWNLOAD_LINK=${{ secrets.FIREBASE_DOWNLOAD_LINK_UAT }}" >> $GITHUB_ENV
          else
            echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID_PROD }}" >> $GITHUB_ENV
            echo "TESTERS=${{ secrets.TESTER_EMAILS_PROD }}" >> $GITHUB_ENV
            echo "VARIANT=release" >> $GITHUB_ENV
            echo "DOWNLOAD_LINK=${{ secrets.FIREBASE_DOWNLOAD_LINK_PROD }}" >> $GITHUB_ENV
          fi

      # 8️⃣ Write Firebase service account JSON to temp file
      - name: Write Firebase service account
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > $GITHUB_WORKSPACE/firebase.json

      # 9️⃣ Upload APK to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: ${{ env.APK_PATH }}
          testers: ${{ env.TESTERS }}
          releaseNotes: "Commit: ${{ github.sha }} | Built on: ${{ env.BUILD_TIME }}"

      # 🔟 Confirmation log
      - name: Print confirmation
        run: echo "✅ APK successfully uploaded to Firebase App Distribution!"

      # 1️⃣1️⃣ Set timestamp for email
      - name: Set email timestamp
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # 1️⃣2️⃣ Send email to testers with direct download link
      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: ${{ env.TESTERS }}
          subject: "[$ENVIRONMENT] New APK uploaded to Firebase"
          body: |
            Hi Team,

            A new *${{ env.ENVIRONMENT }}* build has been uploaded to Firebase App Distribution.

            🔹 **Commit:** ${{ github.sha }}
            🔹 **Build Time:** ${{ env.BUILD_TIME }}
            🔹 **APK:** ${{ env.APK_NAME }}

            👉 [Click here to download the build](${{ env.DOWNLOAD_LINK }})

            You can also find it under Firebase App Distribution → *${{ env.ENVIRONMENT }}* app.

            Best,  
            Tapori CI/CD Bot 🤖
          secure: true
