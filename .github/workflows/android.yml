name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. Rename APK with commit hash + timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          APK_PATH=app/build/outputs/apk/release/app-release.apk
          NEW_APK_NAME=app/build/outputs/apk/release/app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          mv $APK_PATH $NEW_APK_NAME
          echo "APK_NAME=app-release-${COMMIT_HASH}-${TIMESTAMP}.apk" >> $GITHUB_ENV

      # 6. Upload APK as artifact
      - name: Upload APK as artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_NAME }}

      # 7. Get direct download link
      # Uses GITHUB_TOKEN automatically provided by GitHub
      # This token is temporary, scoped to this repo & workflow, and expires after the run
      - name: Get direct download link
        id: get-artifact-url
        uses: peter-evans/artifact-download-url@v2
        with:
          artifact_name: release-apk
          repo: ${{ github.repository }}
          run_id: ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. Save the artifact URL to an environment variable
      - name: Set download URL
        run: echo "APK_URL=${{ steps.get-artifact-url.outputs.download_url }}" >> $GITHUB_ENV

      # 9. Send email to testers with direct download link
      - name: Send Email with Direct APK Link
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: "New Release APK - Commit ${{ github.sha }}"
          body: |
            Hi team,

            The latest release APK is available for direct download:
            ${{ env.APK_URL }}

            Commit: ${{ github.sha }}
            Timestamp: $(date +%Y-%m-%d %H:%M:%S)
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          secure: true
