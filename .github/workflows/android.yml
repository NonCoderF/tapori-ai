name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. Upload APK as artifact
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # 6. Send APK via Email
      - name: Send APK via Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}   # your Gmail
          password: ${{ secrets.EMAIL_PASSWORD }}   # Gmail password
          from: ${{ secrets.EMAIL_USERNAME }}       # required
          subject: "New Release APK"
          body: "Hi team, please find the latest release APK attached."
          to: blackiethebigboss1@gmail.com,sallyinfo365@gmail.com
          attachments: app/build/outputs/apk/release/app-release.apk
          secure: true


