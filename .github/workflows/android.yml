name: Android CI Debug APK

on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Grant permission
      - name: Grant execute permission
        run: chmod +x gradlew

      # Build debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Find APK
      - name: Find APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "Found APK: $APK_FILE"

      # Rename APK
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          NEW_APK_NAME=app-debug-${COMMIT_HASH}-${TIMESTAMP}.apk
          NEW_APK_PATH=app/build/outputs/apk/debug/${NEW_APK_NAME}

          mv "${{ env.APK_FILE }}" "$NEW_APK_PATH"

          echo "APK_PATH=$NEW_APK_PATH" >> $GITHUB_ENV
          echo "APK_NAME=$NEW_APK_NAME" >> $GITHUB_ENV

      # Build timestamp
      - name: Set build timestamp
        run: |
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # Upload to Firebase
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: ${{ env.APK_PATH }}
          testers: ${{ secrets.TESTER_EMAILS }}
          releaseNotes: |
            Debug APK
            Commit: ${{ github.sha }}
            Built on: ${{ env.BUILD_TIME }}

      # Confirmation
      - name: Print confirmation
        run: echo "✅ Debug APK uploaded successfully!"

      # Email timestamp
      - name: Set email timestamp
        run: |
          echo "EMAIL_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # Send email
      - name: Send email to testers
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          from: ${{ secrets.EMAIL_USERNAME }}

          to: |
            blackiethebigboss1@gmail.com,
            sallyinfo365@gmail.com

          subject: Debug APK Uploaded

          body: |
            Hi Team,

            A new debug APK has been uploaded to Firebase App Distribution.

            Commit:
            ${{ github.sha }}

            Build Time:
            ${{ env.EMAIL_TIME }}

            APK:
            ${{ env.APK_NAME }}

            Please check Firebase App Distribution email to download the latest build.
