name: Android CI → Upload to Google Drive

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Build Release APK
      - name: Build release APK
        run: ./gradlew assembleRelease

      # 5️⃣ Rename APK with commit hash and timestamp
      - name: Rename APK
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-${COMMIT_HASH}-${TIMESTAMP}.apk
          echo "APK_PATH=app/build/outputs/apk/release/app-release-${COMMIT_HASH}-${TIMESTAMP}.apk" >> $GITHUB_ENV

      # 6️⃣ Upload to Google Drive
      - name: Upload to Google Drive
        uses: JnyJny/upload-to-gdrive@v2
        with:
          credentials: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          parent_folder_id: 1UrFU8YDFr7Px9D6YZtEtMgZfh3Itgw7z
          file: ${{ env.APK_PATH }}
